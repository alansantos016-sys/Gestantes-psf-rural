name: Validar aplicativo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe JavaScript
        run: |
          for file in app.js storage.js drive-sync.js drive-ui.js config.js google-drive.js sw.js; do
            if [ -f "$file" ]; then
              echo "Verificando $file"
              node --check "$file"
            fi
          done
      - name: Validar manifesto e referências do cache
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifesto JSON válido')"
          node - <<'NODE'
          const fs = require('fs');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const marker = 'const FILES=';
          const start = sw.indexOf(marker);
          if (start < 0) throw new Error('Lista de arquivos do cache não encontrada');
          const arrayStart = sw.indexOf('[', start + marker.length);
          const arrayEnd = sw.indexOf(']', arrayStart);
          if (arrayStart < 0 || arrayEnd < 0) throw new Error('Lista de arquivos do cache inválida');
          const files = JSON.parse(sw.slice(arrayStart, arrayEnd + 1));
          const missing = files.filter(file => {
            const path = file === './' ? '.' : (file.startsWith('./') ? file.slice(2) : file);
            return !fs.existsSync(path);
          });
          if (missing.length) throw new Error('Arquivos ausentes no cache: ' + missing.join(', '));
          console.log('Arquivos do cache encontrados:', files.length);
          NODE
